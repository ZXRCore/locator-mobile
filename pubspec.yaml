name: oxmap
description: 0xMap — location sharing
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_map: ^7.0.0        # OpenStreetMap tiles, no API key
  latlong2: ^0.9.1
  flutter_background_geolocation: ^5.4.0   # DEBUG builds are free (see ТЗ §0)
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.0
  qr_flutter: ^4.1.0            # show my UUID as QR
  mobile_scanner: ^5.2.3        # scan a friend's QR
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3   # receive push notifications

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
