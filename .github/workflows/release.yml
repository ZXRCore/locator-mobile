name: build-and-release

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # google-services.json is gitignored — inject it from a repo secret.
      - name: Restore google-services.json
        run: |
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Read version from pubspec
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          name: 0xMap v${{ steps.ver.outputs.VERSION }}
          files: build/app/outputs/flutter-apk/app-debug.apk
          fail_on_unmatched_files: true
